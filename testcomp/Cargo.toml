# SPDX-License-Identifier: GPL-3.0-only
#
# A workspace of its own, deliberately NOT a member of limina's root workspace and NOT of
# guest/. Three reasons, all load-bearing:
#
#   license  GPL-3.0-only here vs GPL-2.0-only WITH the limina exception everywhere else.
#            Separate programs, never linked — see README.md. A shared workspace would not
#            itself break that, but keeping them apart makes the boundary visible.
#   target   aarch64-unknown-linux-GNU (it dlopens the guest's glibc libvulkan), while
#            guest/ pins aarch64-unknown-linux-MUSL with rust-lld and no C toolchain.
#   toolchain builds in the limina-build:fc43 container, not on the macOS host.
[workspace]
members = ["."]
resolver = "2"

[package]
name = "limina-testcomp"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A small, realistic Wayland compositor for reproducing limina host behaviours"
publish = false

# Versions here are transcribed from synoik's Cargo.toml rather than recalled, so they are
# known to resolve and to work against venus on a limina guest.
[dependencies]
# Wayland protocol state only. Pinned to the UPSTREAM rev synoik's `synoik` branch forks from,
# because that is the exact API surface the synoik code lifted into this crate was written
# against. Not a crates.io version — a version number is a guess until something resolves it —
# and not synoik's fork, whose deltas (para-virt cursor-plane hotspot, text-input) this vehicle
# has no use for and which would only make testcomp harder to build.
#
# We do NOT use smithay's DrmCompositor or its Renderer/Frame traits: implementing that pair for
# a Vulkan renderer is ~6k lines in synoik and buys nothing, since we drive KMS ourselves — and
# DrmCompositor deciding for itself when a buffer is still referenced by a scanout is the very
# behaviour under test.
#
# `desktop` and the `renderer_*` features are deliberately off. Space/Window would track
# buffer lifetime for us, and that is the thing under test — explicit is the point here.
#
# calloop and wayland-server are used through `smithay::reexports::*` and are NOT listed as
# direct dependencies: two copies of either in the graph resolve to distinct types and produce
# "expected `calloop::EventLoop`, found `calloop::EventLoop`".
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "ff5fa7df392cecfba049ffed55cdaa4e98a8e7ef", default-features = false, features = [
    "wayland_frontend",
] }

# The test client is a separate process speaking the real protocol, so it needs the client
# library — a genuinely different crate from the server side, not a duplicate.
wayland-client = "0.31"
# `unstable` is what gates `wp::linux_dmabuf::zv1` — xdg-shell alone needs only `client`.
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
# Vulkan. `ash` rather than a safe wrapper: the scanout path needs external-memory and
# DRM-modifier structs that wrappers tend to lag on, and synoik's proven code is ash.
ash = "0.38.0"

# KMS. drm-rs for the mode/plane/framebuffer objects; we drive the flips ourselves.
drm = "0.14"
drm-ffi = "0.9.1"

anyhow = "1.0"
libc = "0.2"
log = "0.4"
env_logger = "0.11"

[profile.release]
debug = 1 # keep symbols: this is a debugging vehicle, a bare backtrace is worth the size
