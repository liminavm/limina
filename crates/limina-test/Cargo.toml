[package]
name = "limina-test"
description = "End-to-end / regression test harness that drives the real limina binaries"
version.workspace = true
edition.workspace = true
license.workspace = true

# This crate is a *test harness library* plus integration tests. It deliberately has
# NO dependency on the libkrun internal crates: it drives the shipped `limina` supervisor
# binary as a black box (decision: validate from the user's perspective, no shortcuts to
# internal APIs). Boot tests touch Hypervisor.framework, so they are gated behind the
# LIMINA_HVF_TESTS env var and need the signed `limina-vmm` worker on disk — see README.md
# and scripts/test-boot.sh.
[dependencies]
# Display-control socket wire format (resize / display identity + hotplug commands).
limina-displayctl = { workspace = true }
anyhow = { workspace = true }
libc   = { workspace = true }
# Decode captured scanout PNGs for display assertions (the M2 display oracle). Still a
# black-box dep: we read the worker's output file, not any libkrun internal API.
png    = { workspace = true }
# The control-plane wire protocol (M5): tests speak typed frames to the guest agent over
# the vsock-bridged unix stream. Still black-box — the same bytes a product host sends.
limina-proto = { workspace = true }
# The USB/IP server (M7): the mock-attach test runs `limina_usbip::serve` with the hardware-free
# MockBackend on the vsock-bridged stream the guest connects to. default-features off = no libusb
# (the mock needs none); we're exercising the wire protocol the guest's vhci_hcd speaks.
limina-usbip = { path = "../limina-usbip", default-features = false }
# Clipboard assertions (M5): tests read/write the NAMED test pasteboard (LIMINA_PASTEBOARD)
# the supervisor is pointed at — observing the bridge's output the way a macOS app would,
# without ever touching the user's real clipboard.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
