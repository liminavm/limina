[package]
name = "limina-debug"
version.workspace = true
edition.workspace = true
license.workspace = true

# Shared by the supervisor and the worker, so it holds no libkrun and no AppKit types — the
# supervisor has no libkrun dependencies by design, and the worker has no window.
[dependencies]
env_filter = { workspace = true }
env_logger = { workspace = true }
log        = { workspace = true }

# The memory report reads this process from the inside (mach, malloc, dyld), and the census
# names the code its sampled allocations came from.
[target.'cfg(target_os = "macos")'.dependencies]
libc           = { workspace = true }
rustc-demangle = "0.1.28"
