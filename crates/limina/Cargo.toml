[package]
name = "limina"
description = "limina front-end / supervisor — spawns and supervises the limina-vmm worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "limina"
path = "src/main.rs"

[dependencies]
# The supervisor does not call hv_vm_create itself, so it needs no entitlement and
# no libkrun deps — it spawns the (signed) limina-vmm worker and monitors it.
anyhow     = { workspace = true }
# Lock-free swappable Arc for the window's WorkerConn: readers snapshot the current worker's
# pid+fds (OwnedFd — held open while the snapshot lives), the reboot relaunch swaps the set.
arc-swap   = { workspace = true }
clap       = { workspace = true }
env_logger = { workspace = true }
libc       = { workspace = true }
log        = { workspace = true }
# Managed VM definitions (.liminavm bundles / vm.toml) — src/vmlib.
serde      = { workspace = true }
toml       = { workspace = true }

# Shared evdev constants + macOS->Linux keymap + wire format (NO `backends` feature here,
# so this pulls in no libkrun/bindgen; only the worker enables the krun_input backends).
limina-input = { workspace = true }

# Receive guest scanout IOSurfaces from the worker over a Mach port (no global ids).
limina-surfaceport = { workspace = true }

# The host<->guest control-plane wire protocol (M5/D8): the supervisor owns the host side
# of the guest-agent channel (HELLO/WELCOME, heartbeats, orderly SHUTDOWN).
limina-proto = { workspace = true }

# Native window (decision D3: the UI lives in the supervisor). Looks up the worker's
# shared IOSurface by id and shows it via CALayer.contents; an NSTimer on the main thread
# polls state updated by the control-channel reader thread.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSGeometry",
    "NSString",
    "NSTimer",
    "NSDate",
    "block2",
    # Control center: move deleted VM bundles to the macOS Trash.
    "NSFileManager",
    "NSError",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSEvent",
    # Control center (src/center): the VM-library window — stack-view rows with
    # per-row buttons, import via NSOpenPanel, configure via an NSAlert sheet.
    "NSAlert",
    "NSButton",
    "NSControl",
    "NSStackView",
    "NSTextField",
    "NSOpenPanel",
    "NSSavePanel",
    "NSPanel",
    "NSMenu",
    "NSMenuItem",
    "NSColor",
    "NSFont",
    "NSUserInterfaceLayout",
    "NSBox",
    "NSScrollView",
    "NSClipView",
    "NSScreen",
    "NSLayoutConstraint",
    "NSLayoutAnchor",
    # Host-cursor adoption: the guest's cursor image (an IOSurface from the worker) becomes
    # the macOS NSCursor while the pointer is over the guest view, so the only visible
    # pointer is the zero-latency host one wearing the guest's shape.
    "NSCursor",
    "NSImage",
    # Clipboard bridge (M5): NSPasteboard polling + writes, host side of the guest
    # clipboard channel.
    "NSPasteboard",
    "objc2-core-graphics",
    "block2",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "objc2-core-graphics"] }
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef", "IOSurfaceTypes", "libc"] }
objc2-core-foundation = { version = "0.3", features = ["CFBase"] }
objc2-core-graphics = { version = "0.3", features = [
    "CGContext",
    "CGColorSpace",
    "CGImage",
    "CGBitmapContext",
] }
# Diagnostic: dump the rendered layer to a PNG (LIMINA_WINDOW_CAPTURE) without screen-record.
png = { workspace = true }
