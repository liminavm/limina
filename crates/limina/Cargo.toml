[package]
name = "limina"
description = "limina front-end / supervisor — spawns and supervises the limina-vmm worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "limina"
path = "src/main.rs"

[dependencies]
# The supervisor does not call hv_vm_create itself, so it needs no entitlement and
# no libkrun deps — it spawns the (signed) limina-vmm worker and monitors it.
anyhow     = { workspace = true }
clap       = { workspace = true }
env_logger = { workspace = true }
libc       = { workspace = true }
log        = { workspace = true }

# Native window (decision D3: the UI lives in the supervisor). Looks up the worker's
# shared IOSurface by id and shows it via CALayer.contents; an NSTimer on the main thread
# polls state updated by the control-channel reader thread.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSGeometry",
    "NSString",
    "NSTimer",
    "NSDate",
    "block2",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "objc2-core-graphics"] }
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef"] }
objc2-core-foundation = { version = "0.3", features = ["CFBase"] }
objc2-core-graphics = { version = "0.3", features = [
    "CGContext",
    "CGColorSpace",
    "CGImage",
    "CGBitmapContext",
] }
# Diagnostic: dump the rendered layer to a PNG (LIMINA_WINDOW_CAPTURE) without screen-record.
png = { workspace = true }
