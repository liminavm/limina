[package]
name = "limina-display"
description = "limina display backends — host-side scanout sinks for the libkrun virtio-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The display-backend trait + libkrun's generic, safe IntoDisplayBackend FFI wrapper.
# We impl the trait in plain safe Rust; libkrun auto-generates the extern "C" vtable.
krun_display = { workspace = true }

anyhow = { workspace = true }
libc   = { workspace = true }
log    = { workspace = true }
png    = { workspace = true }

# Hand each scanout IOSurface to the supervisor over a Mach port (no global ids → strangers
# can't IOSurfaceLookup the guest screen).
limina-surfaceport = { workspace = true }

# IOSurface-backed display (the window present path): create a shared host scanout the
# supervisor can look up by id and show via CALayer.contents. macOS-only (the whole app is).
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef"] }
objc2-core-foundation = { version = "0.3", features = [
    "CFDictionary",
    "CFNumber",
    "CFString",
    "CFBase",
] }
