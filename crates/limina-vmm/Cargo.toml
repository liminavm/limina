[package]
name = "limina-vmm"
description = "limina VMM worker — boots a Linux guest on libkrun + Hypervisor.framework"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "limina-vmm"
path = "src/main.rs"

[dependencies]
# libkrun internal crates (D2.1). blk on libkrun transitively enables devices/blk; we
# also depend on devices directly for the DiskFormat/SyncMode enums. gpu
# pulls in the virtio-gpu device + rutabaga + krun_display (M2 display).
krun_lib = { workspace = true, features = ["blk", "gpu", "input", "net", "snd", "tpm", "usb"] }
devices = { workspace = true, features = ["blk", "gpu", "input", "net", "snd", "tpm", "usb"] }
polly   = { workspace = true }
utils   = { workspace = true }

# Our virtio-gpu display backends (the capture sink; window/zero-copy later).
limina-display = { workspace = true }
# The renderer's own surfaces reach the supervisor through a publisher we install in it.
limina-surfaceport = { workspace = true }
virglrs = { workspace = true }
# Display-control socket commands (resize / display identity + modes + connection state).
limina-displayctl = { workspace = true }
# Our virtio-input backends (keyboard + absolute pointer), worker side.
limina-input   = { workspace = true, features = ["backends"] }
# The worker inherits the supervisor's stderr, so a Dock-launched app silences its panics too.
limina-paniclog = { workspace = true }
limina-launch = { workspace = true }
# Runtime log filter (the supervisor changes it over `--debug-control-fd`).
limina-debug = { workspace = true }
# The Metal-level GPU transport's GPU host process, which the worker starts and drives.
limina-gpu-wire = { workspace = true }
limina-gpu-host = { workspace = true }
# The user-mode NAT the worker spawns for a NIC on limina-netd, and the rings it shares with it.
limina-netd-wire = { workspace = true }
limina-ring = { workspace = true }

anyhow            = { workspace = true }
clap              = { workspace = true }
crossbeam-channel = { workspace = true }
env_logger        = { workspace = true }
getrandom         = { workspace = true }
libc              = { workspace = true }
log               = { workspace = true }
tracing-appender = "0.2.5"
# The blit that copies the Metal transport's scanouts before they are shown (scanout_copier.rs).
objc2 = "0.6"
block2 = "0.6"
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", features = ["CFBase"] }
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }

