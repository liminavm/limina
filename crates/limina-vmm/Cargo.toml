[package]
name = "limina-vmm"
description = "limina VMM worker — boots a Linux guest on libkrun + Hypervisor.framework"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "limina-vmm"
path = "src/main.rs"

[dependencies]
# libkrun internal crates (D2.1). blk on vmm transitively enables devices/blk; we
# also depend on devices directly for the ImageType/CacheType/SyncMode enums. gpu
# pulls in the virtio-gpu device + rutabaga + krun_display (M2 display).
vmm     = { workspace = true, features = ["blk", "gpu", "input", "net", "snd"] }
devices = { workspace = true, features = ["blk", "gpu", "input", "net", "snd"] }
polly   = { workspace = true }
utils   = { workspace = true }

# Our virtio-gpu display backends (the capture sink; window/zero-copy later).
limina-display = { workspace = true }
# Our virtio-input backends (keyboard + absolute pointer), worker side.
limina-input   = { workspace = true, features = ["backends"] }

anyhow            = { workspace = true }
clap              = { workspace = true }
crossbeam-channel = { workspace = true }
env_logger        = { workspace = true }
libc              = { workspace = true }
log               = { workspace = true }

[build-dependencies]
# Emit the virglrenderer link search path (see build.rs).
pkg-config = "0.3"
