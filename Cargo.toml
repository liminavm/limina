# limina workspace.
#
# Our crates live under crates/ (host, macOS arm64) and agent/ (guest, aarch64-linux).
# We consume libkrun through its INTERNAL Rust crates by path (decision D2.1 — no C
# ABI, no krun-sys); those path-deps live in [workspace.dependencies] below. The
# vendored libkrun tree under third_party/ is its own Cargo workspace, so it is a set
# of external path dependencies, not a member of this one.
[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
# guest/ holds aarch64-linux guest binaries (their own workspace, built for a different
# target); third_party/ is the vendored libkrun workspace; spikes/ are standalone.
exclude = ["third_party", "spikes", "guest"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only WITH LicenseRef-limina-exception"

[workspace.dependencies]
# --- vendored libkrun internal crates (D2.1) ---
vmm          = { package = "krun-vmm",     path = "third_party/libkrun/src/vmm" }
devices      = { package = "krun-devices", path = "third_party/libkrun/src/devices" }
polly        = { package = "krun-polly",   path = "third_party/libkrun/src/polly" }
utils        = { package = "krun-utils",   path = "third_party/libkrun/src/utils" }
# Display backend trait + the safe IntoDisplayBackend FFI wrapper (M2). Same path-dep
# the devices/gpu feature pulls in, so cargo unifies it; we register a native Rust
# backend through its generic wrapper (no manual repr(C) vtable — decision D2.1).
krun_display = { package = "krun-display", path = "third_party/libkrun/src/display", features = ["bindgen_clang_runtime"] }
# virtio-input backend trait + safe IntoInput* FFI wrappers (M2 input). Same path-dep the
# devices/input feature pulls in, so cargo unifies it; we register native Rust input
# backends through the generic wrappers (no manual repr(C) vtable — decision D2.1).
krun_input   = { package = "krun-input",   path = "third_party/libkrun/src/input", features = ["bindgen_clang_runtime"] }

# --- our crates ---
limina-display     = { path = "crates/limina-display" }
limina-input       = { path = "crates/limina-input" }
limina-proto       = { path = "crates/limina-proto" }
limina-surfaceport = { path = "crates/limina-surfaceport" }

# --- shared third-party ---
anyhow            = "1"
arc-swap          = "1"
clap              = { version = "4", features = ["derive"] }
crossbeam-channel = ">=0.5.15"
env_logger        = "0.11"
libc              = "0.2"
log               = "0.4"
png               = "0.17"
# VM definitions (docs/design/vm-definitions.md): vm.toml inside a .liminavm bundle.
# Only the supervisor persists config; the control plane stays minicbor.
serde             = { version = "1", features = ["derive"] }
toml              = "0.8"

# Override imago (libkrun's virtio-blk storage backend, a transitive crates.io dep) with our
# vendored + patched copy. The patch stops a tail-reaching discard from truncating the backing
# file, which otherwise shrinks a fixed-capacity virtio-blk device's advertised capacity across
# a reboot and makes a guest filesystem unmountable ("bad geometry"). The [patch] lives here, in
# the workspace root that actually builds the graph (third_party is excluded from the workspace,
# so libkrun's crates are path deps in *our* build). Vendor/patch with scripts/apply-imago-patch.sh;
# rationale in patches/imago/README.md + spikes/m10-disk-durability/RESULTS.md.
[patch.crates-io]
imago = { path = "third_party/imago" }
