# Pins for the dependency forks under third_party/ (the fork model: github.com/liminavm
# holds a fork of every project we patch; each carries our work on a `limina` branch, with
# `main` tracking upstream untouched). `cargo xtask vendor` clones each repo and checks out
# `rev`. Bumping a dep = push the new fork head, tag the OLD head first (tag-before-rebase:
# every rev ever pinned here must stay reachable), then update `rev` here in the same commit.
# Patch-audit status lives in docs/upstreaming/ledger/.
#
# Every dep is on the fork model now (edk2 was the last holdout, migrated 2026-08-06).
#
# `heavy = true` means `cargo xtask vendor` SKIPS the clone by default — the tree is huge and
# this host never builds it (the kernel builds in a Linux container / build guest, which
# fetches the pinned rev itself). Materialize one on demand with `cargo xtask vendor --heavy`.
# `base` is the upstream tag the `limina` branch sits on; `scripts/export-linux-patches.sh`
# derives the patch series from `base..branch` for the consumers that apply it onto other tags.

# The VMM library (task #14, migrated 2026-08-06). The `limina` branch is the 128-patch series
# rebased onto upstream tip (124 commits: 3 upstream-superseded patches dropped, one squash);
# upstream moved orgs to github.com/libkrun/libkrun. `base` is the upstream commit the branch
# sits on. limina consumes the crates by path ([workspace.dependencies] in the root Cargo.toml),
# so vendor = clone + checkout, nothing to apply. patches/libkrun/ is retired (tombstone README).
[libkrun]
repo = "https://github.com/liminavm/libkrun.git"
upstream = "https://github.com/libkrun/libkrun.git"
branch = "limina"
rev = "32cc37762187c4e9ebb8c0ad5d46af17c2e2b27b"
base = "07fd40dcf6da8e14dd47e16a535531f0383fe52c"

# The EFI firmware (task #22, migrated 2026-08-06). The `limina` branch carries our whole
# delta as commits (TerminalPcdProducerLib build fix, the VirtioSerialDxe TPL fix, PL031
# DT status=okay, the vendored VirtioKeyboardDxe, and the GOP/ConIn enablement) on slp's
# krun-support base — build-krun-efi.sh no longer patches anything at build time. NOT
# vendored by `cargo xtask vendor`: the build clones the pinned rev inside its own
# container volume (scripts/build-krun-efi.sh reads `rev` from this entry). A local
# third_party/edk2 checkout is optional (fork surgery only).
[edk2]
repo = "https://github.com/liminavm/edk2.git"
upstream = "https://github.com/slp/edk2.git"
branch = "limina"
rev = "96006ce134cd8f52f40f3319ec821a17f74019da"
base = "13e8adac8a83141b51375c799996946082e1eb43"

[imago]
repo = "https://github.com/liminavm/imago.git"
upstream = "https://gitlab.com/hreitz/imago.git"
branch = "limina"
rev = "16e9602270e5890ab8fee83bf6f9a438049dabea"

# The HOST KosmicKrisp / zink-on-KK Mesa. NOT vendored by `cargo xtask vendor`: this tree lives at
# /Volumes/mesa-cs/mesa on a case-sensitive sparse image (scripts/ensure-mesa-cs.sh), because Mesa
# will not build on a case-insensitive filesystem. The pin here is the source of truth for WHICH rev
# that checkout should be on; the fork is also the off-machine backup the sparse image never was.
[kosmickrisp]
repo = "https://github.com/liminavm/mesa.git"
upstream = "https://gitlab.freedesktop.org/mesa/mesa.git"
branch = "limina-kk"
rev = "f3a220f279c1fd69f711da6a2d7cb22f984cd12f"
base = "418f2963a15"

# The GUEST venus Mesa (task #11 — same liminavm/mesa repo, its own branch). NOT vendored by
# `cargo xtask vendor`: the working checkout is a worktree at /Volumes/mesa-cs/mesa-guest (same
# case-sensitive image as the KK tree). Consumed as an EXPORTED SERIES by the F44 RPM build —
# `scripts/export-mesa-guest-patches.sh` derives patches/mesa-guest/ (a committed artifact) from
# base..rev, and scripts/provision/f44/build-mesa-rpm.sh applies it via the spec inside the
# build guest (which has no access to this checkout).
[mesa-guest]
repo = "https://github.com/liminavm/mesa.git"
upstream = "https://gitlab.freedesktop.org/mesa/mesa.git"
branch = "limina-guest"
rev = "71410b3be160cd7c0988f82a424655d6e26baf03"
base = "mesa-26.1.7"

# The host GPU renderer, consumed by rutabaga as a Rust crate — nothing here is loaded at
# runtime any more, so this pin decides what the worker *is*, not what it finds. Ours outright,
# so there is no `upstream` and no `base`: the branch is not a delta over anyone.
#
# It carries its own pin of the C virglrenderer (as a build input and as the harness's reference
# leg) in its own third_party/manifest.toml, materialized by its scripts/vendor.sh. limina does
# not pin the C any more: one owner, and this is not it.
[virglrs]
repo = "https://github.com/liminavm/virglrs.git"
branch = "main"
rev = "b900066b08385a3cb265d21f20fe68dc6c81ca7f"

# The OpenCL C standard library KosmicKrisp's kernels are compiled against. NOT a source
# checkout and not merely a configure-time gate: `src/kosmickrisp/libkk/*.cl` (tessellation,
# geometry, draws, queries) are compiled AT BUILD TIME by mesa_clc against these SPIR-V blobs,
# so what is pinned here ends up inside the driver we ship.
#
# Pinned as a Homebrew bottle rather than a git rev because the payload is prebuilt,
# target-independent data: pinning the source would drag in a matching LLVM to build it with,
# which is a far heavier coupling to carry for two data files.
#
# The version is load-bearing and is NOT what `brew install libclc` gives you any more.
# Mesa locates libclc only through pkg-config, then bakes that file's `libexecdir` into
# DYNAMIC_LIBCLC_PATH and reads `spirv64-mesa3d-.spv` from it. libclc 22.x ships both the .pc
# and those filenames; 23.x dropped the .pc and renamed the payload to `<target>/libclc.spv`,
# and there is no `libclc@22` formula. A hand-written .pc over a 23.x install would therefore
# configure, compile, and produce a driver whose kernels were built against the wrong thing.
#
# `blob` is the bottle layer, fetched straight from ghcr by scripts/build-host-mesa.sh and
# checked against `blob_sha256`; `spirv*_sha256` then check the two files we actually use, so
# a bottle for a different platform tag cannot substitute silently. The arm64_tahoe bottle is
# pinned for every host: the payload is OS-independent data, and the file digests prove it.
[libclc]
version = "22.1.3"
bottle_tag = "arm64_tahoe"
blob = "https://ghcr.io/v2/homebrew/core/libclc/blobs/sha256:ade860b92b5326a59d9c439be0b26a5efe3b5036b4ae5ad1369ba02c6269dfe8"
blob_sha256 = "ade860b92b5326a59d9c439be0b26a5efe3b5036b4ae5ad1369ba02c6269dfe8"
spirv_sha256 = "f44305b94e884049d35d3934416a75571eb7bb0085e3593f8c04480956c02e30"
spirv64_sha256 = "f725856fffbfe6dfbe6149a6a49cac407ab3a1c2eee9a7326c3dcdbd8987ee84"

[linux]
repo = "https://github.com/liminavm/linux.git"
upstream = "https://github.com/gregkh/linux.git"
branch = "limina"
rev = "89ba418db60b7059ca010a10146e4b86a64fba41"
base = "v7.1.8"
heavy = true
