# Pins for the dependency forks under third_party/ (the fork model: github.com/liminavm
# holds a fork of every project we patch; each carries our work on a `limina` branch, with
# `main` tracking upstream untouched). `cargo xtask vendor` clones each repo and checks out
# `rev`. Bumping a dep = push the new fork head, tag the OLD head first (tag-before-rebase:
# every rev ever pinned here must stay reachable), then update `rev` here in the same commit.
# Patch-audit status lives in docs/upstreaming/ledger/.
#
# Deps not yet migrated to the fork model (libkrun, kosmickrisp, mesa, edk2) still vendor via
# their committed patches/<dep>/ series; they move here one at a time.
#
# `heavy = true` means `cargo xtask vendor` SKIPS the clone by default — the tree is huge and
# this host never builds it (the kernel builds in a Linux container / build guest, which
# fetches the pinned rev itself). Materialize one on demand with `cargo xtask vendor --heavy`.
# `base` is the upstream tag the `limina` branch sits on; `scripts/export-linux-patches.sh`
# derives the patch series from `base..branch` for the consumers that apply it onto other tags.

[imago]
repo = "https://github.com/liminavm/imago.git"
upstream = "https://gitlab.com/hreitz/imago.git"
branch = "limina"
rev = "5f2c0adba538159282b8941a3f3be61eefbc4769"

# The HOST KosmicKrisp / zink-on-KK Mesa. NOT vendored by `cargo xtask vendor`: this tree lives at
# /Volumes/mesa-cs/mesa on a case-sensitive sparse image (scripts/ensure-mesa-cs.sh), because Mesa
# will not build on a case-insensitive filesystem. The pin here is the source of truth for WHICH rev
# that checkout should be on; the fork is also the off-machine backup the sparse image never was.
# The guest venus/zink Mesa will join this same repo on a `limina-guest` branch (task #24).
[kosmickrisp]
repo = "https://github.com/liminavm/mesa.git"
upstream = "https://gitlab.freedesktop.org/mesa/mesa.git"
branch = "limina-kk"
rev = "47308c0f026bbe2c5bb8efa8316d64355b6431e8"
base = "178a3d73968"

[virglrenderer]
repo = "https://github.com/liminavm/virglrenderer.git"
upstream = "https://gitlab.freedesktop.org/virgl/virglrenderer.git"
branch = "limina"
rev = "4865ae6a5d7474275ba8f5d1a56e4b424a7be8e7"
base = "2048dfb7f3550f0873116b38083182b9ef5eb32a"

[linux]
repo = "https://github.com/liminavm/linux.git"
upstream = "https://github.com/gregkh/linux.git"
branch = "limina"
rev = "07db31df036bfd9986a05061d241d931bbd3ed21"
base = "v7.1.6"
heavy = true
