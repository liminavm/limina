# limina's guest test init — PID 1 for the L1 tiny guest (member of the guest/ workspace).
# Built via scripts/build-test-guest.sh. Hosts the in-init agent seed; the PRODUCT agent
# is the sibling limina-agent crate.
[package]
name = "limina-init"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only WITH LicenseRef-limina-exception"

[[bin]]
name = "limina-init"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# The host<->guest control-plane wire protocol (path dep into the host workspace's crate;
# std-portable, builds for aarch64-unknown-linux-musl).
limina-proto = { path = "../../crates/limina-proto" }
